apiVersion: 1

providers:
  - name: 'Ticket Service Automatics'
    orgId: 1
    folder: 'Production'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/instances
      foldersFromFilesStructure: false