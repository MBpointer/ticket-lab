apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://ticket-prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://ticket-loki:3100
    editable: true
    jsonData:
      maxLines: 1500

  - name: PostgreSQL
    type: postgres
    uid: PostgreSQL     
    access: proxy
    url: ticket-postgres:5432
    user: postgres
    database: ticket_db
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      maxOpenConns: 100
      maxIdleConns: 100
      connMaxLifetime: 14400
      timescaledb: false
