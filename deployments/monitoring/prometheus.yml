global:
  scrape_interval: 5s # Высокая детализация для Highload-тестов

scrape_configs:
  # 1. Метрики вашего локального API-сервера (запущенного в терминале Windows)
  - job_name: 'ticket-api'
    static_configs:
      - targets: ['host.docker.internal:8080']

  # 2. Метрики вашего локального Воркера (запущенного в терминале Windows)
  - job_name: 'ticket-worker'
    static_configs:
      - targets: ['host.docker.internal:8081']

  # 3. Метрики самого Prometheus (внутри контейнера)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
